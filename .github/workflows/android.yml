name: Android APK

on:
  push:
    branches: [main, save-folder-sync]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 29.0.14206865
  CMAKE_VERSION: 3.31.6
  CONAN_ARCH: armv8
  ANDROID_ABI: arm64-v8a

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - name: Checkout SDL submodule
        run: git submodule update --init --depth 1 deps/SDL

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
          echo "ANDROID_NDK_PATH=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install conan
        run: |
          pip install "conan>=2,<3"
          conan profile detect --force

      - name: Restore conan cache
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/p
          key: conan-android-${{ env.CONAN_ARCH }}-${{ env.NDK_VERSION }}-${{ hashFiles('conanfile.py', 'conan/**') }}
          restore-keys: |
            conan-android-${{ env.CONAN_ARCH }}-${{ env.NDK_VERSION }}-

      - name: Build conan dependencies
        run: |
          bash conan/export_libs.sh
          conan install . \
            -pr:h conan/profiles/android -pr:b default \
            -s:h build_type=Release -s:h arch=${CONAN_ARCH} \
            -c:h tools.android:ndk_path="${ANDROID_NDK_PATH}" \
            -c tools.cmake.cmake_layout:build_folder_vars="['settings.arch']" \
            --build=missing
          conan cache clean "*" --source --build --download --temp

      - name: Save conan cache
        if: steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2/p
          key: conan-android-${{ env.CONAN_ARCH }}-${{ env.NDK_VERSION }}-${{ hashFiles('conanfile.py', 'conan/**') }}

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret set, the APK will be signed with a throwaway debug key"
          fi

      - name: Build APK
        working-directory: android-project
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PskipConanInstall -PabiFilters=${ANDROID_ABI}

      - name: Rename APK
        run: |
          APK="infinipaint-fork-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp android-project/app/build/outputs/apk/release/app-release.apk "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$APK" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android build: ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" \
            --notes "Latest arm64 APK built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. Installs alongside the official InfiniPaint as \"InfiniPaint Fork\"."
