name: Android APK

# Builds only when asked to:
# - Push a version tag (e.g. v0.6.1-fork.1) to publish a release with the APK
# - Run it manually from the Actions tab (once this workflow is on the default branch)
# - Changes to this workflow file are built on push, to test them
on:
  push:
    tags: ["v*"]
    paths: [".github/workflows/android.yml"]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 29.0.14206865
  CMAKE_VERSION: 3.31.6
  CONAN_ARCH: armv8
  ANDROID_ABI: arm64-v8a
  # Compiled conan dependencies are stored as assets on this release, since the actions cache
  # is scoped per branch and evicted after 7 days unused
  CONAN_CACHE_RELEASE: conan-cache
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - name: Checkout SDL submodule
        run: git submodule update --init --depth 1 deps/SDL

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
          echo "ANDROID_NDK_PATH=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install conan
        run: |
          pip install "conan>=2,<3"
          conan profile detect --force

      - name: Compute conan cache key
        run: echo "CONAN_CACHE_FILE=conan-android-${CONAN_ARCH}-${NDK_VERSION}-${{ hashFiles('conanfile.py', 'conan/**') }}.tgz" >> "$GITHUB_ENV"

      - name: Restore conan cache from release
        id: release-cache
        run: |
          if gh release download "$CONAN_CACHE_RELEASE" --pattern "$CONAN_CACHE_FILE" --dir "$RUNNER_TEMP" 2>/dev/null; then
            conan cache restore "$RUNNER_TEMP/$CONAN_CACHE_FILE"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "No cached dependencies found for $CONAN_CACHE_FILE"
          fi

      # Fallback for dependencies built before the release cache existed
      - name: Restore conan cache from actions cache
        if: steps.release-cache.outputs.hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/p
          key: conan-android-${{ env.CONAN_ARCH }}-${{ env.NDK_VERSION }}-${{ hashFiles('conanfile.py', 'conan/**') }}

      - name: Build conan dependencies
        run: |
          bash conan/export_libs.sh
          conan install . \
            -pr:h conan/profiles/android -pr:b default \
            -s:h build_type=Release -s:h arch=${CONAN_ARCH} \
            -c:h tools.android:ndk_path="${ANDROID_NDK_PATH}" \
            -c tools.cmake.cmake_layout:build_folder_vars="['settings.arch']" \
            --build=missing

      - name: Save conan cache to release
        if: steps.release-cache.outputs.hit != 'true'
        run: |
          conan cache clean "*" --source --build --download --temp
          conan cache save "*:*" --file "$RUNNER_TEMP/$CONAN_CACHE_FILE"
          ls -lh "$RUNNER_TEMP/$CONAN_CACHE_FILE"
          if ! gh release view "$CONAN_CACHE_RELEASE" > /dev/null 2>&1; then
            gh release create "$CONAN_CACHE_RELEASE" --prerelease --target "$GITHUB_SHA" \
              --title "Build cache (not an app release)" \
              --notes "Compiled dependencies used by the Android build workflow. Not meant to be downloaded."
          fi
          gh release upload "$CONAN_CACHE_RELEASE" "$RUNNER_TEMP/$CONAN_CACHE_FILE" --clobber

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret set, the APK will be signed with a throwaway debug key"
          fi

      - name: Build APK
        working-directory: android-project
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PskipConanInstall -PabiFilters=${ANDROID_ABI}

      - name: Rename APK
        run: |
          APK="infinipaint-fork-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp android-project/app/build/outputs/apk/release/app-release.apk "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Publish tag release
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" --verify-tag \
            --title "InfiniPaint Fork $GITHUB_REF_NAME" \
            --notes "arm64 APK. Installs alongside the official InfiniPaint as \"InfiniPaint Fork\"."

      - name: Publish branch prerelease
        if: github.ref_type == 'branch'
        run: |
          TAG="android-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$APK" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android test build: ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" \
            --notes "Test APK built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. Installs alongside the official InfiniPaint as \"InfiniPaint Fork\"."
